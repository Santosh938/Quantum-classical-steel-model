[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "steelcq"
version = "0.1.0"
description = "Validation-First Classical-Quantum Steel Heat-Treatment, Phase-Transformation, Microstructure, and Property Prediction Framework"
readme = "README.md"
authors = [
    { name = "Computational Materials & Quantum Science Team" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "qiskit>=1.0.0",
    "qiskit-aer>=0.14.0",
    "pylatexenc>=2.10",
    "pillow>=9.5.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
